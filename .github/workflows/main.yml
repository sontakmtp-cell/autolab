name: CI

on:
  push:
    branches: [ "master", "feat/*", "codex/*" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: |
          uv pip install build pytest ".[torch,flax,paxg-web]"
      - name: Build package
        run: uv run python -m build
      - name: Run Tests (PAXG Lab & TimesFM3)
        run: |
          uv run pytest -v tests/paxg_lab/ src/timesfm3/